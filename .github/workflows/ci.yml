name: CI

on:
  push:
    branches: [main, "implementation/**", "codex/**"]
  pull_request:

permissions:
  contents: read
  packages: read

env:
  # No API key is read, and no paid provider call is ever made. Docker image
  # builds may fetch the pinned base image and locked build dependencies.
  CAE_OFFLINE: "1"

jobs:
  # Quality runs on both platforms on purpose: tree checksums, line-ending policy,
  # and path semantics are platform-sensitive, and development happens on Windows
  # while CI would otherwise only ever see Linux.
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests (non-Docker)
        run: uv run pytest -q

      - name: G1 — schema validation
        run: uv run cae validate fixtures

      - name: G11 — tracked-file leak scan
        run: uv run cae hygiene leak-scan --tracked

      - name: Offline publication audit
        run: uv run cae release audit --publication

      - name: Build package
        run: uv build

  # Docker-backed gates are Linux-only: the sandbox profile targets Linux containers.
  docker-gates:
    name: docker gates (G2, G9, sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: G2 — witness contracts
        run: |
          docker pull --platform linux/amd64 ghcr.io/kuotunyu/coding-agent-eval-fx-taskq-py@sha256:392d4fbb33427c4fee63ee6b00fa055665ae37ec099acbc140594ed2010c19ad
          docker pull --platform linux/amd64 ghcr.io/kuotunyu/coding-agent-eval-fx-ledger-ts@sha256:38450742408270a0e48ae053499dd626f61a4cf09139d40ae494838def4b0312
          uv run cae fixture verify fixtures/fx-taskq-py
          uv run cae fixture verify fixtures/fx-ledger-ts
          uv run pytest -q -m docker tests/fixtures

      - name: Sandbox observed-behaviour isolation
        run: uv run pytest -q -m docker tests/sandbox

      - name: G9 — deterministic baseline end-to-end
        run: uv run pytest -q -m docker tests/test_e2e_baseline.py
