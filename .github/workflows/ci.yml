name: CI

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:

permissions:
  contents: read

env:
  # No API key is read, and no paid provider call is ever made. Docker image
  # builds may fetch the pinned base image and locked build dependencies.
  CAE_OFFLINE: "1"

jobs:
  # Quality runs on both platforms on purpose: tree checksums, line-ending policy,
  # and path semantics are platform-sensitive, and development happens on Windows
  # while CI would otherwise only ever see Linux.
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests (non-Docker)
        run: uv run pytest -q

      - name: G1 — schema validation
        run: uv run cae validate fixtures

      - name: G11 — tracked-file leak scan
        run: uv run cae hygiene leak-scan --tracked

      - name: Repository artifact audit
        run: uv run cae release audit

      - name: Build package
        run: uv build

  # Docker-backed gates are Linux-only: the sandbox profile targets Linux containers.
  docker-gates:
    name: docker gates (G2, G9, sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: G2 — witness contracts
        run: |
          docker build --build-arg BASE_DIGEST=sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2 --tag cae/fx-taskq-py:1.0.3 --file fixtures/fx-taskq-py/env/Dockerfile fixtures/fx-taskq-py
          docker build --build-arg BASE_DIGEST=sha256:d649c27dae7ba0137b3cef5dd75baa422c08dc3d9e3fc0c23dfb172dc3cc6436 --tag cae/fx-ledger-ts:1.0.2 --file fixtures/fx-ledger-ts/env/Dockerfile fixtures/fx-ledger-ts
          uv run cae fixture verify fixtures/fx-taskq-py
          uv run cae fixture verify fixtures/fx-ledger-ts
          uv run pytest -q -m docker tests/fixtures

      - name: Sandbox observed-behaviour isolation
        run: uv run pytest -q -m docker tests/sandbox

      - name: G9 — deterministic baseline end-to-end
        run: uv run pytest -q -m docker tests/e2e
