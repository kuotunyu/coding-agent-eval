localization:
  primary:
    file: src/taskq/api.py
    line_start: 45
    line_end: 47
  line_tolerance: 3
  acceptable_alternates: []

canonical_claim: >-
  Request.json refuses a body whose length is exactly the configured maximum,
  although the documented rule turns away only what sits above that size. The
  largest request the documentation undertakes to accept is therefore answered
  with 413, and a client that sizes its requests to the published ceiling finds
  every one of them refused.

canonical_root_cause: >-
  The size comparison uses a non-strict operator where the documented boundary
  is strict. Nothing else changes: the refusal carries its usual status and
  wording, and only a body of precisely the configured size behaves differently
  from what is written down, which is why no existing case notices.

