# fx-taskq-py/B-004 — the payload limit is off by one against its own README.
#
# The README says "larger than max_payload_bytes is rejected with 413". A
# payload of exactly that size is not larger than it. The suite only ever sends
# one comfortably over the limit, so the boundary itself is unchecked.
schema_version: "0.1"
bug_id: fx-taskq-py/B-004
fixture_id: fx-taskq-py
fixture_version: 1.0.5

category: release_claim
