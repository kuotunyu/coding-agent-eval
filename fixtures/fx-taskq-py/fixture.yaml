# fx-taskq-py — fixture manifest.
#
# `tree_checksum` and `environment.fingerprint` are the two values that make a
# result mean anything. The checksum says which bytes were measured; the
# fingerprint says which environment measured them. Two runs whose fingerprints
# differ are not comparable however close their numbers look, which is why the
# fingerprint covers the runtime and package-manager versions and not a
# timestamp or a hostname.
#
# The checksum is taken over the *committed* tree, exported with `git archive`,
# not over a working directory. A working copy can hold build output and
# installed dependencies that were never committed, and a checksum that included
# them would describe a tree no run will ever see.
