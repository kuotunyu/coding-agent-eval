[project]
name = "taskq"
version = "1.0.0"
description = "A small background task queue with an HTTP API and SQLite persistence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# No third-party runtime dependencies: the prepared image needs no package
# resolution, so the measured environment is the same every time it is built.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
